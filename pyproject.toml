[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "error-log-agent-microservices"
version = "0.1.0"
description = "Typed log analysis pipeline for actionable monitoring workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-openai==1.3.2",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
